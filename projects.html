            <div id='categories' class="categories_list">

            <div id="languages" class = "filters_list">

                <button onclick="updateLanguageFilter('c#')" href="#">C#</button>

            <div id="engines" class="filters_list">

            </div>

                    <input type="button" id="search_button" name= "search_button" value="Search">

        <section class="grid" id="projects_grid" style="margin-top:5.5vw;margin-left:1vw;margin-right:1vw">
